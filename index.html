<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>元认知 · 退一步，看着自己思考</title>
<style>
:root{
  --bg:#f7f5fb; --card:#ffffff; --ink:#241b33; --sub:#7a6f8c;
  --line:#e7e0f0; --accent:#6d28d9; --accent2:#4c1d95; --warn:#b45309;
  --ok:#0f7c7c; --bad:#b91c1c; --soft:#f1e9fd; --gold:#b45309;
  --radius:14px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
.hero{padding:26px 22px;background:linear-gradient(135deg,#6d28d9,#9333ea 55%,#c026d3);color:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(109,40,217,.25);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{margin:0 0 8px;font-size:24px;letter-spacing:.5px}
.hero .sub{font-size:14px;opacity:.92;max-width:560px}
.hero .badge{display:inline-block;font-size:12px;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:20px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
.tabs button{flex:1;min-width:80px;padding:11px 8px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:12px;font-size:14px;cursor:pointer;transition:.15s;font-weight:600}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 14px rgba(109,40,217,.28)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{margin:0 0 6px;font-size:18px;color:var(--accent2)}
.card .lead{color:var(--sub);font-size:14px;margin:0 0 14px}
.q-item{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.q-item .q{padding:13px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:15px;background:#faf8fd}
.q-item .q:hover{background:var(--soft)}
.q-item .q .arrow{transition:.2s;color:var(--accent);flex-shrink:0}
.q-item.open .q .arrow{transform:rotate(180deg)}
.q-item .a{max-height:0;overflow:hidden;transition:max-height .25s ease;background:#fff}
.q-item.open .a{max-height:500px}
.q-item .a .inner{padding:12px 14px 14px;color:#3c3347;font-size:14.5px;border-top:1px dashed var(--line)}
.q-item .a b{color:var(--accent2)}
.sec-num{display:inline-flex;width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;align-items:center;justify-content:center;margin-right:8px;font-weight:700}
.step{border-left:3px solid var(--accent);background:#faf8fd;border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:12px}
.step .st-title{font-weight:700;color:var(--accent2);font-size:15px;margin-bottom:6px}
.step .st-body{font-size:14.5px;color:#3c3347}
.step .st-body b{color:var(--accent2)}
.step .hint{font-size:13px;color:var(--warn);margin-top:8px;padding:8px 10px;background:#fff7ed;border-radius:8px;display:none}
.step .hint.show{display:block}
.btn{display:inline-block;border:none;border-radius:11px;padding:11px 18px;font-size:14.5px;font-weight:600;cursor:pointer;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{background:var(--soft);color:var(--accent2)}
.btn.block{display:block;width:100%;text-align:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.quiz-q{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:12px}
.quiz-q .qq{font-weight:600;font-size:15px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:6px 0;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:14px;transition:.12s}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.opt.right{border-color:var(--ok);background:#e6f4f4}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.result-box{text-align:center;padding:28px 20px}
.bigscore{font-size:46px;font-weight:800;color:var(--accent)}
.level{display:inline-block;font-size:15px;font-weight:700;padding:6px 18px;border-radius:20px;margin:8px 0;background:var(--soft);color:var(--accent2)}
.legend{font-size:14px;color:var(--sub);max-width:520px;margin:10px auto}
/* AI 解答 */
.ai-input{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;font-family:inherit;resize:vertical;background:#faf8fd;color:var(--ink)}
.ai-input:focus{outline:none;border-color:var(--accent);background:#fff}
.ai-actions{display:flex;gap:10px;margin-top:12px;align-items:center}
.ai-out{background:#fbfafd;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px;display:none;white-space:normal}
.ai-out.show{display:block}
.ai-out h3,.ai-out h4,.ai-out h2{margin:14px 0 6px;color:var(--accent2);line-height:1.4}
.ai-out h2{font-size:17px}.ai-out h3{font-size:15.5px}.ai-out h4{font-size:14.5px}
.ai-out p{margin:6px 0;font-size:14.5px;color:#3c3347}
.ai-out ul,.ai-out ol{margin:6px 0;padding-left:22px}
.ai-out li{margin:4px 0;font-size:14.5px}
.ai-out table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13.5px}
.ai-out th,.ai-out td{border:1px solid var(--line);padding:7px 9px;text-align:left}
.ai-out th{background:var(--soft);color:var(--accent2)}
.ai-out code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:13px}
.ai-out strong{color:var(--accent2)}
.loading{display:none;align-items:center;gap:10px;margin-top:14px;color:var(--sub);font-size:14px}
.loading.show{display:flex}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.6}
.backend-tag{font-size:12px;color:var(--sub);background:var(--soft);padding:2px 9px;border-radius:20px;display:inline-block}
.foot{margin-top:26px;text-align:center;font-size:12px;color:#b6adc4}
@media (max-width:600px){.tabs button{min-width:70px;font-size:13px;padding:10px 6px}.hero h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="badge">高阶认知能力 · 对思考的思考</span>
    <h1>元认知 · 退一步，看着自己思考</h1>
    <div class="sub">聪明决定你能算多快，元认知决定你算得对不对、该往哪走。这里用问题一步步带你认识它，再用 AI 帮你「不知道怎么办」的事做一次高级元认知思考。</div>
  </div>

  <div class="tabs" id="tabs">
    <button data-v="browse" class="on">浏览</button>
    <button data-v="guide">引导</button>
    <button data-v="test">测一测</button>
    <button data-v="ai">AI 认知解答</button>
  </div>

  <div id="view"></div>

  <div class="foot">内容源自 198 篇元认知研究文献（心理科学进展 / 心理学报 / 教育类核心期刊）· 思考框架融合 E-P-I-C 逻辑与批判性思维推理结构</div>
</div>

<script>
const $ = s => document.querySelector(s);
const el = h => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };

/* ================= 浏览：5 节问题引导 ================= */
const SECTIONS = [
 { n:"一", t:"基础认识：什么是元认知？", lead:"先建立概念——元认知不是「更聪明」，而是「对聪明的觉察」。" , qs:[
  {q:"「元认知」三个字，拆开是什么？", a:"<b>元(meta)</b> 指「关于…之上」；<b>认知(cognition)</b> 是思考、记忆、判断。合起来：<b>元认知 = 对认知本身的认知</b>——退一步，看着自己在想什么、想得对不对。"},
  {q:"它和「聪明」是一回事吗？", a:"不是。<b>认知</b>是「做题」（算得快、记得牢）；<b>元认知</b>是「知道自己为什么这么解、解到哪一步、下一步该换什么方法」。认知决定跑多快，元认知决定方向对不对。"},
  {q:"元认知包含哪三个成分？", a:"①<b>元认知知识</b>：关于人/任务/策略的知识（「我数学弱」「这任务很难」「这方法适合我」）；②<b>元认知体验</b>：过程中的主观感受（熟悉感、<b>舌尖效应</b>、恍然大悟）；③<b>元认知监控</b>：核心动作——<b>计划→监测→评价→调节</b>。"},
  {q:"一句话概括它的闭环？", a:"<b>计划</b>（先想怎么做）→ <b>监测</b>（边做边看对不对）→ <b>评价</b>（做完判断好坏）→ <b>调节</b>（据此改下一次）。一个不断自我校正的循环，跑得越勤，判断越准。"},
 ]},
 { n:"二", t:"决定因素：什么影响了元认知？", lead:"你的元认知判断常常被「表面线索」悄悄带偏。" , qs:[
  {q:"为什么有时「觉得会了」，一考却不会？", a:"<b>加工流畅性</b>。信息越流畅（字大、好读、熟悉），大脑越容易误判「我掌握了」。<b>流畅 ≠ 学会</b>——这是最经典的元认知误判来源（学习判断 JOL 研究反复验证）。"},
  {q:"哪些「线索」会悄悄影响判断？", a:"字体大小、词频、助记线索、<b>社会性线索</b>（看到别人会没会）、样例多样性……文献显示这些线索都会让「学习判断」「信心判断」产生系统性偏差。"},
  {q:"还有哪些稳定的个人因素？", a:"<b>先验知识/专业知识</b>、<b>动机与情绪</b>（数学焦虑会拉低元认知表现）、<b>执行功能</b>、<b>年龄</b>（儿童→青年→老年，监控能力先升后降）。"},
  {q:"环境/社会因素呢？", a:"<b>社会性线索</b>、任务难度、<b>教学支架的多少</b>，都会改变监控准确性。支架合适则判断更准，过度依赖则容易「伪掌握」。"},
 ]},
 { n:"三", t:"影响机制：它是怎么起作用的？", lead:"从「感觉」到「准确判断」再到「行动」，中间有清晰的机制。" , qs:[
  {q:"大脑靠什么「快捷方式」做元认知判断？", a:"<b>流畅性启发式</b>——用「处理起来费不费力」替代「到底掌握没有」。这是又快又常错的捷径，也是多数误判的机制根源。"},
  {q:"更准确的机制是什么？", a:"<b>线索利用模型</b>——真正准确的判断来自「<b>诊断性线索</b>」（真正能反映掌握程度的线索），而非表面流畅性。用对线索，判断就准；被流畅性骗到，就虚高。"},
  {q:"从「觉察」到「行动」是怎么连接的？", a:"<b>监控—控制模型</b>：监测(monitor)→控制(control)→输出。先觉察到「我不会/我错了」，才会触发「换策略/多花时间」的调节。所以<b>觉察是调节的前提</b>——觉察不到，就无从改起。"},
  {q:"它在脑子里有对应位置吗？", a:"有。神经研究发现<b>前额叶皮层(PFC)、后顶叶皮层</b>等脑区与信心判断、元认知监控密切相关，构成一个「元认知脑网络」；这解释了为何执行功能（前额叶）会影响元认知。"},
 ]},
 { n:"四", t:"产生后果：元认知好坏意味着什么？", lead:"元认知是「能力的放大器」——好则放大，差则放大偏差。" , qs:[
  {q:"元认知强，能带来什么？", a:"<b>学业成绩更好</b>（元分析：元认知教学显著提升学业表现）、<b>学习更高效</b>（知道该补哪里）、<b>决策更准</b>（信心校准好，不盲目自信）。"},
  {q:"元认知差/懒惰，会怎样？", a:"<b>元认知懒惰</b>——懒得监控自己的思考，容易<b>过度自信</b>、把直觉当结论，掉进确认偏误、控制错觉等认知偏差（这正是上一讲「认知偏差」的土壤）。"},
  {q:"它和「决策」是什么关系？", a:"<b>信心校准</b>直接决定决策质量。信心与实际正确率越匹配（校准越好），决策越可靠；信心虚高，决策就危险——炒股、跳槽、投资皆如此。"},
  {q:"一句话说后果？", a:"元认知是<b>能力的放大器</b>：认知能力决定你能走多快，元认知决定你走的<b>方向对不对</b>。方向错了，越快越偏。"},
 ]},
 { n:"五", t:"应用方法：怎么练出高级元认知？", lead:"四个可落地的训练方法，从今天就能开始。" , qs:[
  {q:"最轻量的一招是什么？", a:"<b>自我提问</b>。开始前问「我要做什么？怎么做好？」，中途问「我做得对吗？要换方法吗？」，结束后问「我学到什么？下次怎么改进？」——三问形成监控闭环。"},
  {q:"被验证最有效的方法？", a:"<b>元认知提示(prompts) + 反思日志</b>。大量实验与元分析证明：在学习中嵌入元认知提示、坚持写反思日志，能显著提升元认知和自我调节学习能力。"},
  {q:"有哪些经典「四策略」框架？", a:"<b>计划、监控、选择性注意、评价</b>——四个策略配合使用。教学中常按这四个策略设计元认知训练（如整本书阅读、外语听力教学）。"},
  {q:"AI 时代怎么练？", a:"用大模型做<b>启发式提问</b>：让 AI <b>不直接给答案</b>，而是不断向你提问（「你凭什么这么判断？」「有没有反例？」），逼你自己完成元认知监控。这也是下面「AI 认知解答」的设计原理。"},
 ]},
];

function renderBrowse(){
  const v = $('#view');
  v.innerHTML = '';
  SECTIONS.forEach(s=>{
    const card = el(`<div class="card">
      <h2><span class="sec-num">${s.n}</span>${s.t}</h2>
      <p class="lead">${s.lead}</p>
    </div>`);
    const list = el('<div></div>');
    s.qs.forEach(q=>{
      const it = el(`<div class="q-item">
        <div class="q">${q.q}<span class="arrow">▾</span></div>
        <div class="a"><div class="inner">${q.a}</div></div>
      </div>`);
      it.querySelector('.q').onclick = ()=>{ it.classList.toggle('open'); };
      list.appendChild(it);
    });
    card.appendChild(list);
    v.appendChild(card);
  });
}

/* ================= 引导：一个真实难题的 6 步拆解 ================= */
const GUIDE = [
 {t:"第 1 步 · 澄清本质（别急着回答）", b:"先别问「该不该辞职」，先问「我<b>真正</b>卡住的是什么」——是钱？是成长？还是情绪？表层问题往往是深层焦虑的替身。<b>把「该不该」翻译成「我在怕什么 / 想要什么」。</b>", hint:"提示：写下「我想离开的 3 个理由」和「我留下的 3 个理由」，看看哪边更接近「恐惧」而非「事实」。"},
 {t:"第 2 步 · 觉察认知（元认知监控）", b:"退一步，看看自己此刻被哪些<b>直觉、情绪、偏差</b>牵着：<b>损失厌恶</b>（怕失去稳定）、<b>锚定</b>（锚在现在的工资不敢动）、<b>控制错觉</b>（觉得「再忍忍会变好」）。先承认它们在，才能不受它们摆布。", hint:"提示：哪一条最能描述你？把它单独写出来，就等于给它松了绑。"},
 {t:"第 3 步 · 挑战假设（证据检验）", b:"把你「必须为真」的假设逐个检验：<b>「辞职 = 没收入」</b>（有没有过渡方案？）、<b>「留下 = 稳定」</b>（公司/行业真的稳吗？）、<b>「我现在走就亏了」</b>（沉没成本真的该算吗？）。每个假设问：<b>有证据支持吗？有没有反例？</b>", hint:"提示：挑一个最坚固的假设，试着举出一个「它可能不成立」的反例。"},
 {t:"第 4 步 · 生成方案（意涵衍生）", b:"至少列出<b>三条层次不同的路径</b>：<b>留</b>（争取内部调整/涨薪）／<b>走</b>（有备再辞）／<b>折中</b>（副业试水、请假体验、先面几家）。每条写清：代价、收益、隐含假设、最坏情况。", hint:"提示：三条路径里，哪一条是你「从没认真考虑过」的？往往那才是突破口。"},
 {t:"第 5 步 · 信心校准（决策监控）", b:"对每条路径问：<b>我的把握有几成？</b> 这个把握有证据吗，还是只是「感觉」？再定一个<b>再评估点</b>：什么新信息出现，我会改变主意？（比如「拿到一个 offer」「3 个月后 KPI 仍无起色」）", hint:"提示：给每条路径打一个「信心分」(0–100)，并标注「什么会让我改分」。"},
 {t:"第 6 步 · 语境重构（落地）", b:"把答案拉回你的<b>真实处境</b>：以你现在的存款、家庭、市场行情，哪条路<b>最现实</b>？最后落到一个明确的<b>第一步行动</b>——不是「辞职」，而是「这周先约 2 个面试 / 和领导谈一次 / 开个副业小号试试」。", hint:"提示：把「要不要」这种纠结，降级成「下一步先做什么」——纠结立刻变可执行。"},
];

function renderGuide(){
  const v = $('#view');
  v.innerHTML = '';
  const intro = el(`<div class="card"><h2>引导 · 用元认知拆解「该不该辞职」</h2><p class="lead">跟着下面 6 步，看一次高级元认知是怎么「退一步思考」的。每步点「看提示」练手。</p></div>`);
  v.appendChild(intro);
  GUIDE.forEach(g=>{
    const step = el(`<div class="step">
      <div class="st-title">${g.t}</div>
      <div class="st-body">${g.b}</div>
      <div class="hint">${g.hint}</div>
      <button class="btn ghost" style="margin-top:8px" onclick="this.previousElementSibling.classList.toggle('show')">看提示</button>
    </div>`);
    v.appendChild(step);
  });
  const tail = el(`<div class="card" style="text-align:center"><p class="lead" style="margin:0">这就是「高级元认知」——不替你决定，而是让你看清自己没看清的那一层。<br>现在把你的真实难题交给「AI 认知解答」试试。</p><button class="btn primary" style="margin-top:14px" onclick="switchView('ai')">去 AI 认知解答 →</button></div>`);
  v.appendChild(tail);
}

/* ================= 测一测 ================= */
const QUIZ = [
 {q:"「元认知」最准确的意思是？", opts:["比一般人更聪明","对认知过程的觉察与调控","快速记忆大量信息","天生的思考天赋"], a:1},
 {q:"「觉得自己会了，一考却不会」，最可能的原因是？", opts:["题目太难了","加工流畅性造成的误判","记忆力衰退","运气不好"], a:1},

 {q:"哪种做法最能提升元认知？", opts:["反复刷题到熟练","自我提问 + 反思日志","背更多知识点","延长学习时间"], a:1},
 {q:"「舌尖效应」（话到嘴边想不起）最能体现元认知的？", opts:["元认知体验/监测","记忆力强","语言能力","注意力涣散"], a:0},
 {q:"加工流畅性高（读着很顺）通常会导致？", opts:["低估自己","高估自己的掌握程度","判断更准","没有影响"], a:1},
 {q:"一个元认知强的学习者，最可能怎么做？", opts:["一直用同一种方法","发现自己不会就换策略","从不反思","只学感兴趣的"], a:1},
];
let quizDone = false;
function renderTest(){
  quizDone = false; answers = {};
  const v = $('#view');
  v.innerHTML = '';
  const card = el(`<div class="card"><h2>测一测 · 你的元认知水平</h2><p class="lead">10 道题，做完点「提交」看等级。</p><div class="quiz-body"></div></div>`);
  const body = card.querySelector('.quiz-body');
  QUIZ.forEach((q, qi)=>{
    const item = el(`<div class="quiz-q"><div class="qq">${qi+1}. ${q.q}</div></div>`);
    q.opts.forEach((o, oi)=>{
      const b = el(`<button class="opt">${String.fromCharCode(65+oi)}. ${o}</button>`);
      b.onclick = ()=>{ if(quizDone) return; pick(qi, oi, b); };
      item.appendChild(b);
    });
    body.appendChild(item);
  });
  body.appendChild(el(`<button class="btn primary block" style="margin-top:6px" onclick="finishTest()">提交答案</button>`));
  v.appendChild(card);
}
let answers = {};
function pick(qi, oi, btn){
  answers[qi] = oi;
  const opts = btn.parentElement.querySelectorAll('.opt');
  opts.forEach((o,i)=>{ o.classList.remove('sel','right','wrong'); });
  opts[oi].classList.add('sel');
}
function finishTest(){
  if(quizDone) return;
  let n=0, score=0;
  QUIZ.forEach((q,qi)=>{ n++; if(answers[qi]===q.a) score++; });
  quizDone = true;
  // 标出对错
  document.querySelectorAll('.quiz-q').forEach((item, qi)=>{
    const opts = item.querySelectorAll('.opt');
    opts.forEach((o, oi)=>{
      if(oi===QUIZ[qi].a) o.classList.add('right');
      else if(answers[qi]===oi) o.classList.add('wrong');
    });
  });
  const pct = Math.round(score/n*100);
  let lv = pct>=85?'元认知高手':pct>=60?'元认知在线':'元认知待开发';
  const cls = pct>=85?'#0f7c7c':pct>=60?'#6d28d9':'#b91c1c';
  const legend = pct>=85?'你能持续觉察并校正自己的思考，判断力很强。继续保持「计划—监测—评价—调节」的闭环。'
    :pct>=60?'你已具备元认知基础，但偶尔仍被流畅性、直觉抢跑。建议回「浏览」补补机制，再到「引导」练一遍。'
    :'你的元认知还在沉睡。别灰心——它是可训练的。从「自我提问」三问开始，每天练一点。';
  const box = el(`<div class="result-box">
    <div class="bigscore">${score} / ${n}</div>
    <div class="level" style="color:${cls}">${lv}</div>
    <div class="legend">正确率 ${pct}%。${legend}</div>
    <button class="btn primary block" onclick="renderTest()">再测一次</button>
  </div>`);
  const body = $('#view').querySelector('.quiz-body');
  const submit = body.querySelector('.btn.primary.block');
  body.insertBefore(box, submit);
  submit.remove();
}

/* ================= AI 认知解答 ================= */
const SYS_PROMPT = `你是一位「高级元认知教练」。你的任务不是直接给建议，而是带着提问者完成一次高水平的元认知思考，最终给出「比直觉更高一层的答案」。

元认知 = 对认知的认知：退一步，觉察并调控自己的思考过程。

你必须严格按以下六步推进，用 Markdown 分节输出（## 作为步骤标题），每一步末尾给一个「可以继续追问」的钩子：

## 第一步 · 澄清本质
先别急着回答。把问题「翻译」一遍——他真正卡住的到底是什么？区分「表层问题」和「深层问题」，说出背后的真实诉求或真实恐惧。

## 第二步 · 觉察认知（元认知监控）
指出提问者此刻可能正在被哪些默认假设、直觉（系统1）、情绪或认知偏差牵着走（可用：确认偏误、损失厌恶、锚定、过度自信、控制错觉、幸存者偏差等）。先承认它们在，才能不受它们摆布。

## 第三步 · 挑战假设（证据检验）
对上面每个默认假设，问：有什么证据支持它？有什么证据反对它？有没有替代解释？它是不是「必须为真」？

## 第四步 · 生成方案（意涵衍生）
给出至少 3 个层次不同的可选路径（从保守到激进），每条说清：代价、收益、隐含假设、最坏情况。

## 第五步 · 信心校准（决策监控）
检查：对每条路径的把握有多大？这个把握有证据吗？什么新信息会让你改变主意？设定一个「再评估点」。

## 第六步 · 语境重构（落地）
把答案拉回提问者的真实处境：以他现在的资源、时间、情绪状态，哪条路最现实？给出一个明确的「第一步行动」并说明为什么。

最后用一句话给出「最高级的答案」——不是替 TA 做决定，而是让 TA 看到自己没看到的那一层。

语言要求：中文，克制、清晰、有洞察力，不啰嗦，不用空洞的正确话。如果问题涉及医疗/法律/投资等专业领域，先声明「这不是专业建议」，再给思考框架。不要拒绝回答，也不要只给鸡汤。`;

function detectBackend(){
  const proto = location.protocol;
  const host = location.hostname;
  if(proto === 'http:' && (host==='112.126.85.156' || host==='localhost' || host==='127.0.0.1' || host.endsWith('.youranopc.com'))){
    return { name:'DeepSeek · 高级元认知', type:'deepseek', url:'/api/meta' };
  }
  return { name:'免费 AI · Pollinations', type:'pollinations', url:'https://text.pollinations.ai/' };
}

function renderAi(){
  const v = $('#view');
  v.innerHTML = '';
  const bk = detectBackend();
  const card = el(`<div class="card">
    <h2>AI 认知解答 <span class="backend-tag">${bk.name}</span></h2>
    <p class="lead">把你「不知道怎么办」的事写下来。AI 会退一步，用高级元认知（觉察→挑战假设→生成方案→校准→落地）帮你看见自己没看见的那一层。</p>
    <textarea class="ai-input" id="aiInput" placeholder="例如：我在现在的公司待了 5 年，越来越没劲，想辞职又怕找不到更好的，家里还指望我稳定，我到底该怎么办？"></textarea>
    <div class="ai-actions">
      <button class="btn primary" id="aiGo">开始思考</button>
      <button class="btn ghost" id="aiExample">举个示例</button>
    </div>
    <div class="loading" id="aiLoading"><span class="spinner"></span>正在用高级元认知思考，稍等…</div>
    <div class="ai-out" id="aiOut"></div>
    <p class="note">提示：写清楚「具体处境 + 你的顾虑」，答案会更有针对性。涉及医疗/法律/投资等重大决策时，AI 只给思考框架，不替代专业意见。</p>
  </div>`);
  v.appendChild(card);
  $('#aiGo').onclick = doAsk;
  $('#aiExample').onclick = ()=>{ $('#aiInput').value = '我在现在的公司待了 5 年，越来越没劲，想辞职又怕找不到更好的，家里还指望我稳定，我到底该怎么办？'; };
  $('#aiInput').addEventListener('keydown', e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter') doAsk(); });
}

async function doAsk(){
  const q = $('#aiInput').value.trim();
  if(!q){ $('#aiInput').focus(); return; }
  const out = $('#aiOut'), load = $('#aiLoading');
  out.classList.remove('show'); out.innerHTML=''; load.classList.add('show');
  $('#aiGo').disabled = true;
  try{
    const bk = detectBackend();
    let text = '';
    if(bk.type === 'deepseek'){
      const r = await fetch(bk.url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ question: q }) });
      const j = await r.json();
      if(!r.ok) throw new Error(j.error || '服务错误');
      text = j.text || '';
    } else {
      const r = await fetch(bk.url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ messages:[{role:'system',content:SYS_PROMPT},{role:'user',content:q}] }) });
      if(!r.ok) throw new Error('免费接口暂不可用，请稍后重试');
      text = await r.text();
    }
    if(!text) throw new Error('AI 未返回内容');
    out.innerHTML = mdToHtml(text);
    out.classList.add('show');
  }catch(e){
    out.innerHTML = `<p style="color:var(--bad)">${escapeHtml(e.message||'出错了')}</p>`;
    out.classList.add('show');
  }finally{
    load.classList.remove('show');
    $('#aiGo').disabled = false;
  }
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mdToHtml(md){
  const inline = t => escapeHtml(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
  const lines = String(md).split('\n');
  let html = '', inUl = false, inOl = false, para = [];
  const closeLists = ()=>{ if(inUl){html+='</ul>';inUl=false;} if(inOl){html+='</ol>';inOl=false;} };
  const flushPara = ()=>{ if(para.length){ html += '<p>'+inline(para.join(' '))+'</p>'; para=[]; } };
  for(const raw of lines){
    const line = raw.trim();
    if(!line){ flushPara(); closeLists(); continue; }
    let m;
    if((m = line.match(/^(#{1,3})\s+(.*)/))){ flushPara(); closeLists(); const lv=m[1].length; html += '<h'+lv+'>'+inline(m[2])+'</h'+lv+'>'; continue; }
    if((m = line.match(/^[-*•]\s+(.*)/))){ flushPara(); if(inOl){html+='</ol>';inOl=false;} if(!inUl){html+='<ul>';inUl=true;} html += '<li>'+inline(m[1])+'</li>'; continue; }
    if((m = line.match(/^\d+[.、)]\s*(.*)/))){ flushPara(); if(inUl){html+='</ul>';inUl=false;} if(!inOl){html+='<ol>';inOl=true;} html += '<li>'+inline(m[1])+'</li>'; continue; }
    para.push(line);
  }
  flushPara(); closeLists();
  return html;
}

/* ================= 路由 ================= */
function switchView(v){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  if(v==='browse') renderBrowse();
  else if(v==='guide') renderGuide();
  else if(v==='test') renderTest();
  else if(v==='ai') renderAi();
}
$('#tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  switchView(b.dataset.v);
});
renderBrowse();
